# Builds the Android app in the cloud. Run it from the Actions tab ("Run workflow").
# With the four ANDROID_* secrets set it makes a signed .aab for Google Play; without them, a test .apk.
# The result is attached to the run as a download (Artifacts).
name: Phone app - Android
on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]
permissions:
  contents: read
concurrency:
  group: app-android
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor and the plugins
        run: npm install --no-audit --no-fund
      - name: Web bundle
        run: npm run prepare-www && node scripts/configure-native.mjs www
      - name: Android project
        run: npx cap add android
      - name: Icons and splash screens
        run: npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#0c1117' --iconBackgroundColorDark '#0c1117' --splashBackgroundColor '#f6f7f8' --splashBackgroundColorDark '#0c1117'
      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret yet, so this run makes a test APK instead of a Play Store bundle."
          fi
      - name: Permissions, AdMob ID, version, signing
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: node scripts/configure-native.mjs android && npx cap sync android
      - name: Build
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then ./gradlew --no-daemon bundleRelease; else ./gradlew --no-daemon assembleDebug; fi
      - name: What went into the build
        run: |
          echo "::notice::Plugins: $(npm ls --depth=0 2>/dev/null | grep -oE '@(capacitor|capgo|capacitor-community)/[a-z-]+@[0-9.]+' | tr '\n' ' ')"
          echo "::notice::Android SDK: $(grep -E 'minSdkVersion|targetSdkVersion|compileSdkVersion' android/variables.gradle | tr -s ' ' | tr '\n' ' ')"
          echo "::notice::Web bundle: index.html $(wc -c < www/index.html) bytes, native.bundle.js $(wc -c < www/native.bundle.js) bytes, plugins on window.AtlasNative: $(grep -c AtlasNative www/native.bundle.js)"
          echo "::notice::Outputs: $(cd android/app/build/outputs && find . -name '*.aab' -o -name '*.apk' | xargs -r ls -l | awk '{print $5, $9}' | tr '\n' ' ')"
      - uses: actions/upload-artifact@v5
        with:
          name: dateline-atlas-android-${{ github.run_number }}
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
